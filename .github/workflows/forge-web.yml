name: Forge Web

on:
  push:
    branches: [main, "claude/**"]
    paths: ["forge-web/**", "src/forge/**", ".github/workflows/forge-web.yml"]
  pull_request:
    paths: ["forge-web/**", "src/forge/**", ".github/workflows/forge-web.yml"]
  workflow_dispatch:

concurrency:
  group: forge-web-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: forge-web

jobs:
  gate:
    name: gate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync
      - name: Lint
        run: uv run ruff check .
      - name: Types
        run: uv run mypy packages
      - name: Tests
        run: uv run pytest -q

  web-ui:
    name: web UI (typecheck, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: forge-web/frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: forge-web/frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Types
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  docker:
    name: docker isolation (real containers)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Build the sandbox image
        working-directory: .
        run: docker build -f forge-web/docker/sandbox.Dockerfile -t forge-web-sandbox:dev .
      - name: Install
        run: uv sync
      - name: Docker tests
        run: uv run pytest -q -m docker
