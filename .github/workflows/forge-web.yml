name: Forge Web

on:
  push:
    branches: [main, "claude/**"]
    paths: ["forge-web/**", "src/forge/**", ".github/workflows/forge-web.yml"]
  pull_request:
    paths: ["forge-web/**", "src/forge/**", ".github/workflows/forge-web.yml"]
  workflow_dispatch:

concurrency:
  group: forge-web-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: forge-web

jobs:
  gate:
    name: gate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync
      - name: Lint
        run: uv run ruff check .
      - name: Types
        run: uv run mypy packages
      - name: Tests
        run: uv run pytest -q

  web-ui:
    name: web UI (typecheck, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: forge-web/frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: forge-web/frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Types
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  docker:
    name: docker isolation (real containers)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Build the sandbox image
        working-directory: .
        run: >-
          docker build -f forge-web/docker/sandbox.Dockerfile -t forge-web-sandbox:dev
          --build-arg PYTHON_IMAGE=mirror.gcr.io/library/python:3.12-slim-bookworm .
      - name: Install
        run: uv sync
      - name: Docker tests
        run: uv run pytest -q -m docker

  apple:
    # The whole Apple flow with the real Xcode: a chat's builds, tests and screenshots go through
    # the server to forge-mac-worker in direct mode (GitHub's Macs cannot run VMs, so no Tart).
    name: Apple flow on a Mac (real Xcode)
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install
        run: |
          uv sync
          brew install xcodegen
      - name: Apple flow
        env:
          APPLE_SHOTS_DIR: ${{ runner.temp }}/apple-flow
        run: |
          mkdir -p "$APPLE_SHOTS_DIR"
          set -o pipefail
          uv run pytest -m mac -v -rA 2>&1 | tee "$APPLE_SHOTS_DIR/pytest.txt"
      - name: Stop the simulators
        if: always()
        run: xcrun simctl shutdown all || true
      - name: Keep the screenshots and the test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apple-flow
          path: ${{ runner.temp }}/apple-flow
          if-no-files-found: ignore

  e2e:
    name: end-to-end in Chromium (${{ matrix.isolation }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        isolation: [local, docker]
    env:
      FORGE_WEB_E2E_ISOLATION: ${{ matrix.isolation }}
      FORGE_WEB_TEST_IMAGE: forge-web-sandbox:dev
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: forge-web/frontend/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Build the web UI
        working-directory: forge-web/frontend
        run: npm ci && npm run build
      - name: Install
        run: uv sync && uv run playwright install --with-deps chromium
      - name: Build the sandbox image
        if: matrix.isolation == 'docker'
        working-directory: .
        run: >-
          docker build -f forge-web/docker/sandbox.Dockerfile -t forge-web-sandbox:dev
          --build-arg PYTHON_IMAGE=mirror.gcr.io/library/python:3.12-slim-bookworm .
      - name: End-to-end tests
        run: uv run pytest -q -m e2e
