name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: uv sync
      - name: Lint
        run: uv run ruff check .
      - name: Types
        run: uv run mypy src
      - name: Tests
        run: uv run pytest -q
      - name: Offline evals
        run: uv run forge --fake eval

  browser:
    # The browser agent against a real Chromium (the gate jobs skip it: no browser installed).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install
        run: |
          uv sync
          uv run playwright install --with-deps chromium
      - name: Browser tests
        env:
          FORGE_REQUIRE_BROWSER: "1"
        run: uv run pytest -q tests/conformance/test_browser_conformance.py tests/test_browser.py

  fullstack:
    # A product from `forge app new` installed from its lockfiles and tested for real: the server's
    # own tests on PostgreSQL, the web client's tests and build (the gate jobs skip these tests:
    # they need PyPI, npm and a database).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: fullstack
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: |
          uv sync
          ls /usr/lib/postgresql/*/bin/initdb || sudo apt-get install -y postgresql
      - name: Full-stack tests
        env:
          FULLSTACK_DATABASE_URL: postgresql://postgres:ci@localhost:5432/fullstack
          FULLSTACK_REQUIRE_ALL: "1"
        run: uv run pytest -m fullstack -v -rA

  apple:
    # The app from `forge apple new` built, tested, archived and photographed on every Apple
    # platform with a real Xcode (the gate jobs skip these tests: they need a Mac with Xcode).
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install
        run: |
          uv sync
          brew install xcodegen
      - name: Xcode and simulators
        run: |
          xcodebuild -version
          xcodegen --version
          xcrun simctl list devices available
      - name: Apple tests
        env:
          APPLE_SHOTS_DIR: ${{ runner.temp }}/apple-shots
        run: |
          mkdir -p "$APPLE_SHOTS_DIR"
          set -o pipefail
          uv run pytest -m apple -v -rA 2>&1 | tee "$APPLE_SHOTS_DIR/pytest.txt"
      - name: Stop the simulators
        if: always()
        run: xcrun simctl shutdown all || true
      - name: Keep the screenshots and the test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apple-screenshots
          path: ${{ runner.temp }}/apple-shots
          if-no-files-found: ignore

  windows-shells:
    # The shell tools, the sandbox and the executor with each Windows shell on its own.
    name: windows shell (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: PowerShell 7
            powershell: pwsh
            bash: none
          - name: Windows PowerShell 5.1
            powershell: powershell.exe
            bash: none
          - name: Git Bash
            powershell: none
            bash: C:\Program Files\Git\bin\bash.exe
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      FORGE_POWERSHELL: ${{ matrix.powershell }}
      FORGE_BASH: ${{ matrix.bash }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync
      - name: Shell, files, sandbox and executor tests
        run: >-
          uv run pytest -q tests/test_shell.py tests/test_tools_files.py tests/test_sandbox.py
          tests/test_permissions.py tests/conformance/test_executor_conformance.py
