name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: uv sync
      - name: Lint
        run: uv run ruff check .
      - name: Types
        run: uv run mypy src
      - name: Tests
        run: uv run pytest -q
      - name: Offline evals
        run: uv run forge --fake eval

  browser:
    # The browser agent against a real Chromium (the gate jobs skip it: no browser installed).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install
        run: |
          uv sync
          uv run playwright install --with-deps chromium
      - name: Browser tests
        env:
          FORGE_REQUIRE_BROWSER: "1"
        run: uv run pytest -q tests/conformance/test_browser_conformance.py tests/test_browser.py

  windows-shells:
    # The shell tools, the sandbox and the executor with each Windows shell on its own.
    name: windows shell (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: PowerShell 7
            powershell: pwsh
            bash: none
          - name: Windows PowerShell 5.1
            powershell: powershell.exe
            bash: none
          - name: Git Bash
            powershell: none
            bash: C:\Program Files\Git\bin\bash.exe
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      FORGE_POWERSHELL: ${{ matrix.powershell }}
      FORGE_BASH: ${{ matrix.bash }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync
      - name: Shell, files, sandbox and executor tests
        run: >-
          uv run pytest -q tests/test_shell.py tests/test_tools_files.py tests/test_sandbox.py
          tests/test_permissions.py tests/conformance/test_executor_conformance.py
