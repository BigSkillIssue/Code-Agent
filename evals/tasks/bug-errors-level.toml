edits = [{ path = "logparse.py", old = "    return [parse_line(line).message for line in lines if \"ERROR\" in line]", new = "    entries = [parse_line(line) for line in lines]\n    return [entry.message for entry in entries if entry.level == \"ERROR\"]" }]
