prompt = "errors() also returns INFO lines that merely mention ERROR in their message; it must only return lines whose level is ERROR."
check = '''{python} -c "from logparse import errors; lines = ['2026-01-01 10:00:00 INFO no ERROR here', '2026-01-01 10:00:01 ERROR boom']; assert errors(lines) == ['boom'], errors(lines)"'''

