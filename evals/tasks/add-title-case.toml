edits = [{ path = "textutil.py", old = "def shout(", new = "def title_case(text: str) -> str:\n    \"\"\"Capitalise every word.\"\"\"\n    return \" \".join(w.capitalize() for w in text.split())\n\n\ndef shout(" }]
