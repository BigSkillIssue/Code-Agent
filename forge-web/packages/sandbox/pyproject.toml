[project]
name = "forge-sandbox"
version = "0.1.0"
description = "Forge Web's sandbox runtime: the daemon, the Forge worker and the wire protocol that run inside each project's container."
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "forge",
    "pydantic>=2.9",
]

[project.optional-dependencies]
# A terminal in local isolation mode on a Windows host.
windows = ["pywinpty>=2.0; sys_platform == 'win32'"]

[project.scripts]
forge-sandbox = "forge_sandbox.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forge_sandbox"]
