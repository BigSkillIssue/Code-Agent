[project]
name = "forge-hostworker"
version = "0.1.0"
description = "Forge Web's host worker: runs the full-stack products a Forge Web server hosts, on a Linux server of their own, every app in gVisor (runsc) containers."
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "cryptography>=43",
    "httpx>=0.27",
    "pydantic>=2.9",
]

[project.scripts]
forge-host-worker = "forge_hostworker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forge_hostworker"]
