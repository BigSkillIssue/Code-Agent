[project]
name = "forge-web"
version = "0.1.0"
description = "Forge Web: a multi-user server with a web UI for the Forge coding agent (projects, chats, files, git, terminal, live preview)."
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "forge",
    "forge-sandbox",
    "forge-macworker",  # only its wire module: what server and Macs send each other
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "cryptography>=42",
    "argon2-cffi>=23.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29"]

[project.scripts]
forge-web = "forge_web.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forge_web"]
# The built web UI is not in git; it goes into the wheel all the same.
artifacts = ["src/forge_web/static/**"]
