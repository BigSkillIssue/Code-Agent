[project]
name = "forge-web"
version = "0.1.0"
description = "Forge Web: a multi-user server with a web UI for the Forge coding agent (projects, chats, files, git, terminal, live preview)."
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "forge",
    "forge-sandbox",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
]

[project.scripts]
forge-web = "forge_web.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forge_web"]
