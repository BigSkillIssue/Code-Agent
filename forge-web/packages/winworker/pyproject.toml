[project]
name = "forge-winworker"
version = "0.2.0"
description = "Forge Web's Windows worker: tests the products' Windows apps and packs them with Velopack for their websites, on a Windows machine of its own; a signing machine signs them."
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.9",
]

[project.scripts]
forge-win-worker = "forge_winworker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forge_winworker"]
