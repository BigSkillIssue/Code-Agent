[project]
name = "forge-macworker"
version = "0.1.0"
description = "Forge Web's Mac build worker: runs Apple builds, tests and screenshots for a Forge Web server, each project in its own macOS VM (Tart)."
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "forge",
    "httpx>=0.27",
    "pydantic>=2.9",
]

[project.scripts]
forge-mac-worker = "forge_macworker.cli:main"
forge-mac-job = "forge_macworker.job:main"  # runs one job inside a VM

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forge_macworker"]
