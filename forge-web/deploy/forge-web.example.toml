# Copy to forge-web/forge-web.toml (compose) or /etc/forge-web/forge-web.toml (system service).
# Every value can also be set as FORGE_WEB_<SECTION>__<KEY>; admins change many of them later
# in the web UI (Administration -> Settings).

[auth]
signup = "invite"            # invite | approval | open
# allowed_domains = ["example.com"]
admin_two_factor = true      # admins must use two-factor sign-in

# Sign-in with Google: console.cloud.google.com -> APIs & Services -> Credentials.
# Redirect URI: https://FORGE_DOMAIN/api/auth/oauth/google/callback
# [auth.providers.google]
# client_id = "1234-abc.apps.googleusercontent.com"   # secret: GOOGLE_SECRET in .env

# Sign-in with GitHub: github.com -> Settings -> Developer settings -> OAuth Apps.
# Callback URL: https://FORGE_DOMAIN/api/auth/oauth/github/callback
# [auth.providers.github]
# client_id = "Ov23li..."                             # secret: GITHUB_SECRET in .env

# Sign in with Apple: developer.apple.com -> Identifiers -> Services IDs, and a key with
# "Sign in with Apple". Return URL: https://FORGE_DOMAIN/api/auth/oauth/apple/callback
# [auth.providers.apple]
# client_id = "com.example.forge.signin"   # the Services ID
# team_id = "ABCDE12345"
# key_id = "XYZ987WVU6"
# key_file = "/config/AuthKey_XYZ987WVU6.p8"          # or APPLE_SECRET in .env

# Facebook Login: developers.facebook.com -> My Apps -> Create App -> Facebook Login.
# Valid OAuth redirect URI: https://FORGE_DOMAIN/api/auth/oauth/facebook/callback
# [auth.providers.facebook]
# client_id = "1234567890"                            # the App ID; secret: FACEBOOK_SECRET
# trust_email = true    # Meta sends no "email verified" flag; without this, no new accounts

[sandbox]
cpus = 2.0
memory = "4g"
idle_minutes = 30

[quotas]
projects_per_user = 20
project_disk_mb = 10000

[gateway]
server_keys_for = "granted"  # admins | granted | everyone
monthly_limit_usd = 20.0

# Hosting the apps Forge builds on your own Linux servers (docs/EINRICHTUNG.md §11).
# [hosting]
# enabled = true
# apps_domain = "meine-apps.de"   # apps answer at <app>.meine-apps.de and <app>.staging.meine-apps.de
# provider_name = "Beispiel Hosting GmbH"    # you, as the apps' privacy pages name their host
# provider_address = "Hauptstraße 1, 10115 Berlin"
# contact_email = "abuse@example.com"         # for authorities and notices (DSA Art. 11, 12, 16)
# mail_daily_max = 1000                       # mails a day per app at most (needs [auth.smtp])
# [hosting.images]                # the runtime images the hosts pull (fixed versions)
# "python3.12" = "ghcr.io/bigskillissue/forge-runtime-python:3.12"
# static = "ghcr.io/bigskillissue/forge-runtime-static:1"
