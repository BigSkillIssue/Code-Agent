[project]
name = "forge"
version = "0.1.0"
description = "Forge: a provider-agnostic coding agent that refines, plans, executes and verifies every task."
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "aiosqlite>=0.20",
    "anthropic>=0.69",
    "google-genai>=1.0",
    "httpx>=0.27",
    "litellm>=1.70",
    "markdownify>=1.2.3",
    "pydantic>=2.9",
    "rich>=13.7",
    "sqlalchemy[asyncio]>=2.0",
    "textual>=8.2.8",
    "tree-sitter>=0.26.0",
    "tree-sitter-language-pack>=1.21.0",
]

[project.scripts]
forge = "forge.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forge"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["examples/buggy", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = [
    "RUF001", # ambiguous unicode in strings: docs and prompts use typographic dashes
    "RUF002",
    "RUF003",
    "RUF012", # pydantic models declare mutable defaults on purpose
]

[tool.ruff.lint.per-file-ignores]
# Tool docstrings and prompts are model-facing text that must match docs/TOOLS.md word for word.
"src/forge/tools.py" = ["E501"]
"src/forge/prompts.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["forge"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: calls a real provider API (needs API keys; skipped by default)",
]
